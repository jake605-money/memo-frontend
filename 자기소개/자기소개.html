<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김지환 자기소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>김지환을 소개합니다</h1>
    <button id="theme-btn">🌙 다크모드</button>
  </header>

  <main class="cards">
    <!-- 카드 1 · 프로필 (4장에서 만든 카드) -->
    <article class="card">
      <img src="https://placehold.co/120" alt="김하나 프로필 사진">
      <h2>김지환</h2>
      <p class="role">디지털금융 MBA</p>
      <p>종합상사 자금팀에서 일하고 있습니다</p>
    </article>

    <!-- 카드 2 · 항목마다 이 블록을 복제해 채운다 -->
    <article class="card">
      <h2>관심 분야</h2>
      <p class="role">무엇을 파고드나</p>
      <p>업무 자동화, 블록체인</p>
    </article>

    <!-- 카드 3 -->
    <article class="card">
      <h2>이번 학기 목표</h2>
      <p class="role">무엇을 만들 것인가</p>
      <p>사내 품의 내용을 쉽게 볼 수 있는 업무 자동화 프로그램</p>
    </article>

        <!-- 카드 4 -->
    <article class="card">
      <h2>연락처</h2>
      <p class="role">이메일</p>
      <p>jake6051@gmail.com</p>
    </article>
  </main>

  <footer>
    <p>© 2026 김지환</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
